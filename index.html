<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>⚡ بريدي السريع</title>
<meta name="theme-color" content="#0a0e17">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e17;--surface:#111827;--surface2:#1a2332;
  --border:#1f2937;--border-b:#2d3748;
  --text:#e6edf3;--dim:#8b949e;--mute:#6e7681;
  --blue:#58a6ff;--cyan:#22d3ee;--green:#10b981;
  --green-b:#34d399;--purple:#a371f7;--pink:#f472b6;
  --orange:#fb923c;--red:#f87171;
}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(circle at 10% 10%,rgba(88,166,255,.15),transparent 35%),
    radial-gradient(circle at 90% 90%,rgba(163,113,247,.15),transparent 35%),
    radial-gradient(circle at 50% 50%,rgba(16,185,129,.08),transparent 50%);
  pointer-events:none;z-index:0;
}
.app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:24px 14px 80px}
.hdr{text-align:center;margin-bottom:24px}
.pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 16px;
  background:linear-gradient(135deg,rgba(88,166,255,.15),rgba(34,211,238,.15));
  border:1px solid rgba(88,166,255,.4);
  border-radius:100px;font-size:11px;font-weight:800;
  color:var(--cyan);letter-spacing:1px;margin-bottom:12px;
  text-transform:uppercase;font-family:monospace;
}
.live-dot{width:7px;height:7px;background:var(--green-b);border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(52,211,153,.7)}
  70%{box-shadow:0 0 0 12px rgba(52,211,153,0)}
  100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}
}
h1{
  font-size:clamp(28px,7vw,44px);font-weight:900;
  background:linear-gradient(135deg,#58a6ff,#22d3ee,#a371f7,#f472b6);
  background-size:300% 300%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:-1.5px;line-height:1.1;margin-bottom:6px;
  animation:gradient 4s ease infinite;
}
@keyframes gradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.sub{color:var(--dim);font-size:13px;font-weight:500}
.card{
  background:linear-gradient(180deg,rgba(17,24,39,.95),rgba(10,14,23,.9));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:18px;
  padding:20px;margin-bottom:16px;
  box-shadow:0 20px 60px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(88,166,255,.6),transparent);
}
.lbl{
  display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:800;color:var(--dim);
  text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;
  font-family:monospace;
}
.lbl-dot{width:5px;height:5px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue)}
.email-bar{display:flex;gap:10px;flex-wrap:wrap}
.email-input{
  flex:1;min-width:220px;background:rgba(10,14,23,.9);
  border:1.5px solid var(--border);color:var(--cyan);
  padding:14px 16px;border-radius:12px;
  font-family:'JetBrains Mono',Consolas,monospace;
  font-size:14px;font-weight:700;
  direction:ltr;text-align:left;outline:none;
  transition:all .2s;letter-spacing:.3px;
}
.email-input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(88,166,255,.15)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 18px;border:none;border-radius:12px;
  font-family:inherit;font-size:13px;font-weight:800;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.btn:active{transform:scale(.95)}
.btn-primary{background:linear-gradient(135deg,#059669,#10b981);color:#fff;box-shadow:0 6px 20px rgba(16,185,129,.4)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(16,185,129,.55)}
.btn-ghost{background:rgba(31,41,55,.7);color:var(--text);border:1px solid var(--border-b)}
.btn-ghost:hover{background:var(--surface2);border-color:var(--blue);transform:translateY(-2px)}
.inbox-hdr{
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:14px;border-bottom:1px solid var(--border);
  margin-bottom:14px;flex-wrap:wrap;gap:10px;
}
.status{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--green-b);font-family:monospace}
.ping{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;background:rgba(34,211,238,.1);
  border:1px solid rgba(34,211,238,.3);
  border-radius:100px;font-size:10px;font-weight:800;
  color:var(--cyan);font-family:monospace;
}
.count{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;background:rgba(88,166,255,.1);
  border:1px solid rgba(88,166,255,.3);
  border-radius:100px;font-size:12px;font-weight:800;
  color:var(--blue);font-family:monospace;
}
.btn-refresh{
  display:inline-flex;align-items:center;gap:5px;
  padding:7px 12px;background:transparent;
  border:1px solid var(--border-b);border-radius:10px;
  color:var(--blue);font-size:11px;font-weight:800;
  cursor:pointer;transition:all .2s;font-family:inherit;
}
.btn-refresh:hover{background:rgba(88,166,255,.08);border-color:var(--blue)}
.messages{display:flex;flex-direction:column;gap:12px;min-height:60px}
.empty{text-align:center;padding:50px 20px;color:var(--mute);font-size:13px}
.empty-icon{font-size:52px;opacity:.3;margin-bottom:12px;display:block}
.mail{
  background:linear-gradient(180deg,rgba(10,14,23,.7),rgba(17,24,39,.6));
  border:1px solid var(--border);border-radius:14px;
  padding:16px;transition:all .25s;position:relative;overflow:hidden;
}
.mail-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:11px}
.mail-from{
  color:var(--cyan);font-weight:800;direction:ltr;
  font-family:monospace;font-size:10px;
  padding:4px 9px;background:rgba(34,211,238,.1);
  border-radius:6px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:65%;
}
.mail-date{color:var(--mute);font-size:10px;font-weight:700;font-family:monospace}
.mail-subject{font-size:15px;font-weight:800;color:var(--text);margin-bottom:12px;line-height:1.4;word-break:break-word}
.otp{
  background:linear-gradient(135deg,rgba(16,185,129,.18),rgba(52,211,153,.08));
  border:1.5px solid rgba(16,185,129,.5);
  border-radius:12px;padding:14px 16px;
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin-bottom:12px;
}
.otp-lbl{font-size:9px;font-weight:900;color:var(--green-b);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-family:monospace}
.otp-code{
  font-family:'JetBrains Mono',Consolas,monospace;
  font-size:26px;font-weight:900;letter-spacing:5px;
  color:var(--green-b);direction:ltr;
}
.btn-otp{
  background:linear-gradient(135deg,#059669,#10b981);
  color:#fff;border:none;padding:11px 16px;border-radius:10px;
  font-family:inherit;font-size:12px;font-weight:900;
  cursor:pointer;white-space:nowrap;
}
.mail-body{
  background:rgba(10,14,23,.85);
  border:1px solid var(--border);border-radius:10px;
  padding:13px 15px;font-size:12.5px;line-height:1.7;
  color:#b8c2cc;direction:ltr;text-align:left;
  white-space:pre-wrap;word-break:break-word;
  max-height:180px;overflow-y:auto;
  font-family:'JetBrains Mono',Consolas,monospace;
}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  background:linear-gradient(135deg,rgba(16,185,129,.95),rgba(5,150,105,.95));
  color:#fff;padding:12px 20px;border-radius:12px;
  font-size:13px;font-weight:800;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
}
.toast.err{background:linear-gradient(135deg,rgba(248,113,113,.95),rgba(220,38,38,.95))}
@media(max-width:520px){
  .email-bar{flex-direction:column}
  .btn{width:100%}
  .otp{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<div class="app">
  <header class="hdr">
    <div class="pill"><span class="live-dot"></span>LIVE • متصل</div>
    <h1>بريدي السريع</h1>
    <p class="sub">⚡ استقبال فوري للرسائل وأكواد التفعيل</p>
  </header>

  <div class="card">
    <div class="lbl"><span class="lbl-dot"></span>بريدك المؤقت</div>
    <div class="email-bar">
      <input type="text" id="emailDisplay" class="email-input" value="جاري إنشاء البريد..." readonly>
      <button class="btn btn-primary" id="copyBtn">📋 نسخ</button>
      <button class="btn btn-ghost" id="newBtn">🔄 جديد</button>
    </div>
  </div>

  <div class="card">
    <div class="inbox-hdr">
      <div class="status"><span class="live-dot"></span>جاهز للاستقبال</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="ping" id="pingBox">⚡ --ms</span>
        <span class="count" id="countBox">0 رسالة</span>
        <button class="btn-refresh" id="refreshBtn">🔄 تحديث</button>
      </div>
    </div>
    <div class="messages" id="messagesList">
      <div class="empty">
        <span class="empty-icon">📬</span>
        <div>صندوق الوارد فارغ</div>
        <div style="font-size:11px;margin-top:6px;opacity:.7">الرسائل ستظهر هنا تلقائياً دون إعادة تحميل</div>
      </div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
(function(){
'use strict';

/* ═══════ Guerrilla Mail API — اتصال مباشر بدون بروكسي ═══════ */
const BASE_API = 'https://api.guerrillamail.com/ajax.php';

let st = {
  email: '', sid: '', seq: 0,
  msgs: [], seen: new Set(),
  timer: null, polling: false,
  lastPing: 0
};

const $ = id => document.getElementById(id);

/* ═══════ Utils ═══════ */
function toast(msg, err){
  const c = $('toasts');
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.remove(); }, 2500);
}

function sanitize(s){
  if(typeof s !== 'string') return '';
  return s.replace(/<style[\s\S]*?<\/style>/gi,'')
          .replace(/<script[\s\S]*?<\/script>/gi,'')
          .replace(/<[^>]*>/g,' ')
          .replace(/&nbsp;/gi,' ')
          .replace(/\s+/g,' ')
          .trim();
}

function findCode(txt){
  if(!txt || typeof txt !== 'string') return null;
  const s = txt.slice(0, 5000);
  let m = s.match(/(?:code|otp|verify|verification|pin|كود|رمز|تأكيد|التحقق|التفعيل)[^\d]{0,25}(\d{4,8})\b/i);
  if(m) return m[1];
  m = s.match(/(?::|is|هو)\s*(\d{4,8})\b/i);
  if(m) return m[1];
  return null;
}

/* ═══════ API مباشر بدون بروكسي ═══════ */
async function apiRequest(params, timeoutMs = 8000){
  const targetUrl = BASE_API + '?' + params;
  const t0 = performance.now();

  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), timeoutMs);

  try{
    const res = await fetch(targetUrl, {
      method: 'GET',
      credentials: 'omit',
      cache: 'no-store',
      signal: ctrl.signal
    });
    clearTimeout(to);

    const latency = Math.round(performance.now() - t0);
    st.lastPing = latency;
    const pBox = $('pingBox');
    if(pBox) pBox.textContent = '⚡ ' + latency + 'ms';

    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    try { return JSON.parse(text); }
    catch(e){
      const cleaned = text.replace(/^[^{]*/, '').replace(/[^}]*$/, '');
      return JSON.parse(cleaned);
    }
  }catch(e){
    clearTimeout(to);
    throw e;
  }
}

/* ═══════ حفظ واسترجاع الحساب (عشان لو حصل خطأ يرجع الإيميل القديم) ═══════ */
function saveAccount(){
  try{
    localStorage.setItem('fm_email', st.email);
    localStorage.setItem('fm_sid', st.sid);
    localStorage.setItem('fm_seq', String(st.seq));
    localStorage.setItem('fm_ts', String(Date.now()));
  }catch(e){}
}

function loadAccount(){
  try{
    const email = localStorage.getItem('fm_email');
    const sid = localStorage.getItem('fm_sid');
    const seq = localStorage.getItem('fm_seq');
    const ts = Number(localStorage.getItem('fm_ts') || 0);

    if(!email || !sid) return false;
    // الحساب صالح لمدة 24 ساعة
    if(ts && Date.now() - ts > 86400000){
      localStorage.removeItem('fm_email');
      localStorage.removeItem('fm_sid');
      localStorage.removeItem('fm_seq');
      localStorage.removeItem('fm_ts');
      return false;
    }

    st.email = email;
    st.sid = sid;
    st.seq = Number(seq) || 0;
    return true;
  }catch(e){ return false; }
}

function clearAccount(){
  try{
    localStorage.removeItem('fm_email');
    localStorage.removeItem('fm_sid');
    localStorage.removeItem('fm_seq');
    localStorage.removeItem('fm_ts');
  }catch(e){}
}

/* ═══════ إنشاء حساب جديد ═══════ */
async function createAccount(){
  $('emailDisplay').value = 'جاري التحضير...';
  stopPolling();

  try{
    const data = await apiRequest('f=get_email_address');
    if(!data || !data.email_addr || !data.sid_token) throw new Error('Invalid response');

    st.email = data.email_addr;
    st.sid = data.sid_token;
    st.seq = 0;
    st.seen.clear();
    st.msgs = [];

    saveAccount();
    $('emailDisplay').value = st.email;
    renderAll();
    startPolling();
    checkMail();
    toast('✓ تم إنشاء البريد بنجاح');
  }catch(e){
    console.warn('createAccount:', e.message);
    $('emailDisplay').value = 'فشل — اضغط جديد';
    toast('فشل الاتصال — حاول تاني', true);
  }
}

/* ═══════ Polling ═══════ */
function startPolling(){
  if(st.timer) clearInterval(st.timer);
  st.timer = setInterval(checkMail, 2000);
}

function stopPolling(){
  if(st.timer){ clearInterval(st.timer); st.timer = null; }
}

/* ═══════ فحص الرسائل ═══════ */
async function checkMail(){
  if(!st.sid || st.polling) return;
  st.polling = true;

  try{
    const data = await apiRequest('f=check_email&seq=0&sid_token=' + encodeURIComponent(st.sid));
    const list = Array.isArray(data && data.list) ? data.list : [];
    let hasNew = false;

    for(const m of list){
      if(!m || !m.mail_id) continue;
      const id = String(m.mail_id);
      if(st.seen.has(id)) continue;
      if(String(m.mail_from).includes('no-reply@guerrillamail.com')) continue;

      st.seen.add(id);
      hasNew = true;
      st.msgs.push({
        id,
        from: m.mail_from || 'مجهول',
        subject: m.mail_subject || '(بدون عنوان)',
        intro: sanitize(m.mail_excerpt || ''),
        body: '',
        loaded: false,
        date: m.mail_date || ''
      });
    }

    if(hasNew){
      saveAccount();
      renderAll();
      toast('📬 وصلت رسالة جديدة!');
      st.msgs.filter(m => !m.loaded).forEach(fetchBody);
    }
  }catch(e){
    console.warn('Poll Error:', e.message);
  }finally{
    st.polling = false;
  }
}

/* ═══════ جلب محتوى الرسالة ═══════ */
async function fetchBody(m){
  try{
    const data = await apiRequest('f=fetch_email&email_id=' + encodeURIComponent(m.id) + '&sid_token=' + encodeURIComponent(st.sid));
    let text = '';
    if(typeof data.mail_body === 'string') text = data.mail_body;
    else if(Array.isArray(data.mail_body)) text = data.mail_body.join('\n');
    m.body = sanitize(text) || m.intro || '(محتوى فارغ)';
    m.loaded = true;
    renderAll();
  }catch(e){
    m.body = m.intro || '(تعذر جلب المحتوى)';
    m.loaded = true;
    renderAll();
  }
}

/* ═══════ Render ═══════ */
function renderAll(){
  const list = $('messagesList');
  const cnt = $('countBox');
  cnt.textContent = st.msgs.length + ' رسالة';

  if(!st.msgs.length){
    list.innerHTML = '<div class="empty"><span class="empty-icon">📬</span><div>صندوق الوارد فارغ</div><div style="font-size:11px;margin-top:6px;opacity:.7">الرسائل ستظهر هنا تلقائياً دون إعادة تحميل</div></div>';
    return;
  }

  const frag = document.createDocumentFragment();
  [...st.msgs].reverse().forEach(m => {
    const code = findCode(m.subject + ' ' + (m.body || m.intro));

    const card = document.createElement('div');
    card.className = 'mail';

    const head = document.createElement('div');
    head.className = 'mail-head';
    const fromEl = document.createElement('span');
    fromEl.className = 'mail-from';
    fromEl.textContent = m.from;
    const dateEl = document.createElement('span');
    dateEl.className = 'mail-date';
    dateEl.textContent = m.date;
    head.appendChild(fromEl);
    head.appendChild(dateEl);
    card.appendChild(head);

    const subj = document.createElement('div');
    subj.className = 'mail-subject';
    subj.textContent = m.subject;
    card.appendChild(subj);

    if(code){
      const otp = document.createElement('div');
      otp.className = 'otp';
      const inner = document.createElement('div');
      const lbl = document.createElement('div');
      lbl.className = 'otp-lbl';
      lbl.textContent = 'رمز التحقق';
      const codeEl = document.createElement('div');
      codeEl.className = 'otp-code';
      codeEl.textContent = code;
      inner.appendChild(lbl);
      inner.appendChild(codeEl);
      const btn = document.createElement('button');
      btn.className = 'btn-otp';
      btn.textContent = '⚡ نسخ';
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(code).then(() => toast('✓ تم نسخ الكود'));
      });
      otp.appendChild(inner);
      otp.appendChild(btn);
      card.appendChild(otp);
    }

    const body = document.createElement('div');
    body.className = 'mail-body';
    body.textContent = m.body || m.intro || 'جاري التحميل...';
    card.appendChild(body);

    frag.appendChild(card);
  });

  list.innerHTML = '';
  list.appendChild(frag);
}

/* ═══════ Events ═══════ */
$('copyBtn').addEventListener('click', () => {
  if(!st.email) return;
  navigator.clipboard.writeText(st.email).then(() => toast('✓ تم نسخ الإيميل'));
});

$('newBtn').addEventListener('click', () => {
  clearAccount();
  st.email = '';
  st.sid = '';
  st.seq = 0;
  st.msgs = [];
  st.seen.clear();
  createAccount();
});

$('refreshBtn').addEventListener('click', checkMail);

/* ═══════ Init — يرجع الإيميل القديم لو موجود ═══════ */
function init(){
  if(loadAccount()){
    $('emailDisplay').value = st.email;
    renderAll();
    startPolling();
    checkMail();
  }else{
    createAccount();
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{
  init();
}

})();
</script>
</body>
</html>
