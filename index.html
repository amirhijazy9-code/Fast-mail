<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>⚡ بريدي السريع</title>
<meta name="theme-color" content="#0a0e17">
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e17;--border:#1f2937;--text:#e6edf3;--dim:#8b949e;
  --cyan:#22d3ee;--green-b:#34d399;--blue:#58a6ff;--purple:#a371f7;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 10% 10%,rgba(88,166,255,.15),transparent 35%),radial-gradient(circle at 90% 90%,rgba(163,113,247,.15),transparent 35%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:24px 14px 80px}
.hdr{text-align:center;margin-bottom:24px}
h1{font-size:clamp(28px,7vw,44px);font-weight:900;background:linear-gradient(135deg,#58a6ff,#22d3ee,#a371f7,#f472b6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1.5px}
.sub{color:var(--dim);font-size:13px}
.card{background:rgba(17,24,39,.95);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 20px 60px -20px rgba(0,0,0,.7);position:relative;overflow:hidden}
.lbl{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;font-family:monospace}
.email-bar{display:flex;gap:10px;flex-wrap:wrap}
.email-input{flex:1;min-width:220px;background:rgba(10,14,23,.9);border:1.5px solid var(--border);color:var(--cyan);padding:14px 16px;border-radius:12px;font-family:monospace;font-size:14px;font-weight:700;direction:ltr;text-align:left;outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 18px;border:none;border-radius:12px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
.btn-ghost{background:rgba(31,41,55,.7);color:var(--text);border:1px solid var(--border)}
.inbox-hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap;gap:10px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--green-b);font-family:monospace}
.ping{display:inline-flex;align-items:center;padding:4px 10px;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);border-radius:100px;font-size:10px;font-weight:800;color:var(--cyan);font-family:monospace}
.count{display:inline-flex;align-items:center;padding:6px 14px;background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.3);border-radius:100px;font-size:12px;font-weight:800;color:var(--blue);font-family:monospace}
.btn-refresh{display:inline-flex;align-items:center;padding:7px 12px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--blue);font-size:11px;font-weight:800;cursor:pointer;font-family:inherit}
.messages{display:flex;flex-direction:column;gap:12px;min-height:60px}
.empty{text-align:center;padding:50px 20px;color:var(--dim);font-size:13px}
.empty-icon{font-size:52px;opacity:.3;margin-bottom:12px;display:block}
.mail{background:rgba(10,14,23,.7);border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;animation:slideIn .35s ease backwards}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
.mail-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:11px}
.mail-from{color:var(--cyan);font-weight:800;direction:ltr;font-family:monospace;font-size:11px;padding:4px 9px;background:rgba(34,211,238,.1);border-radius:6px}
.mail-date{color:var(--dim);font-size:10px;font-family:monospace}
.mail-subject{font-size:15px;font-weight:800;color:var(--text);margin-bottom:12px;word-break:break-word}
.otp{background:linear-gradient(135deg,rgba(16,185,129,.18),rgba(52,211,153,.08));border:1.5px solid rgba(16,185,129,.5);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;animation:otpGlow 2.5s ease-in-out infinite}
@keyframes otpGlow{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}50%{box-shadow:0 0 25px 0 rgba(16,185,129,.35)}}
.otp-lbl{font-size:9px;font-weight:900;color:var(--green-b);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-family:monospace}
.otp-code{font-family:monospace;font-size:26px;font-weight:900;letter-spacing:5px;color:var(--green-b);direction:ltr}
.btn-otp{background:linear-gradient(135deg,#059669,#10b981);color:#fff;border:none;padding:11px 16px;border-radius:10px;font-family:inherit;font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap}
.mail-body{background:rgba(10,14,23,.85);border:1px solid var(--border);border-radius:10px;padding:13px 15px;font-size:12.5px;line-height:1.7;color:#b8c2cc;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow-y:auto;font-family:monospace}
.skel{background:linear-gradient(90deg,rgba(31,41,55,.4) 25%,rgba(45,55,72,.6) 50%,rgba(31,41,55,.4) 75%);background-size:200% 100%;animation:skel 1.4s infinite;border-radius:6px}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:90vw}
.toast{background:linear-gradient(135deg,rgba(16,185,129,.95),rgba(5,150,105,.95));color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:800;box-shadow:0 15px 40px rgba(0,0,0,.5);animation:toastIn .35s ease;text-align:center}
.toast.err{background:linear-gradient(135deg,rgba(248,113,113,.95),rgba(220,38,38,.95))}
@keyframes toastIn{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:520px){.email-bar{flex-direction:column}.btn{width:100%}.otp{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>

<div class="app">
  <header class="hdr">
    <div class="pill" style="display:inline-flex;align-items:center;gap:8px;padding:6px 16px;background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.4);border-radius:100px;font-size:11px;font-weight:800;color:var(--cyan);letter-spacing:1px;margin-bottom:12px;font-family:monospace">
      <span style="width:7px;height:7px;background:var(--green-b);border-radius:50%;animation:pulse 1.5s infinite"></span>LIVE • متصل
    </div>
    <h1>بريدي السريع</h1>
    <p class="sub">⚡ استقبال فوري للرسائل وأكواد التفعيل</p>
  </header>

  <div class="card">
    <div class="lbl"><span style="width:5px;height:5px;border-radius:50%;background:var(--blue)"></span>بريدك المؤقت</div>
    <div class="email-bar">
      <input type="text" id="emailDisplay" class="email-input" value="جاري إنشاء البريد..." readonly>
      <button class="btn btn-primary" id="copyBtn">📋 نسخ</button>
      <button class="btn btn-ghost" id="newBtn">🔄 جديد</button>
    </div>
  </div>

  <div class="card">
    <div class="inbox-hdr">
      <div class="status"><span style="width:7px;height:7px;background:var(--green-b);border-radius:50%"></span>جاهز للاستقبال</div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="ping" id="pingBox">⚡ --ms</span>
        <span class="count" id="countBox">0 رسالة</span>
        <button class="btn-refresh" id="refreshBtn">🔄 تحديث</button>
      </div>
    </div>
    <div class="messages" id="messagesList">
      <div class="empty">
        <span class="empty-icon">📬</span>
        <div>صندوق الوارد فارغ</div>
        <div style="font-size:11px;margin-top:6px;opacity:.7">الرسائل ستظهر هنا تلقائياً دون إعادة تحميل</div>
      </div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
(function(){
'use strict';

/* ═══════ الإعدادات — بدون بروكسي، Guerrilla بتدعم CORS مباشرة ═══════ */
const API = 'https://api.guerrillamail.com/ajax.php';
const POLL_FAST = 900;
const POLL_NORMAL = 2000;
const POLL_SLOW = 3500;
const FAST_WINDOW = 25000;
const FETCH_TIMEOUT = 6000;

let st = {
  email: '', sid: '',
  msgs: [], seen: new Set(),
  timer: null, polling: false,
  lastNew: Date.now(),
  errors: 0, lastPing: 0,
  bodyCache: new Map()
};

const $ = id => document.getElementById(id);

/* ═══════ Utils ═══════ */
function toast(msg, err){
  const c = $('toasts');
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'all .3s';
    t.style.opacity = '0';
    t.style.transform = 'translateY(30px)';
    setTimeout(() => t.remove(), 300);
  }, 2000);
}

function sanitize(s){
  if(typeof s !== 'string') return '';
  return s.replace(/<style[\s\S]*?<\/style>/gi,'')
          .replace(/<script[\s\S]*?<\/script>/gi,'')
          .replace(/<[^>]*>/g,' ')
          .replace(/&nbsp;/gi,' ')
          .replace(/&amp;/gi,'&')
          .replace(/&lt;/gi,'<')
          .replace(/&gt;/gi,'>')
          .replace(/&quot;/gi,'"')
          .replace(/&#39;/gi,"'")
          .replace(/\s+/g,' ')
          .trim();
}

function findCode(txt){
  if(!txt || typeof txt !== 'string') return null;
  const s = txt.slice(0, 5000);
  let m = s.match(/(?:code|otp|verify|verification|pin|كود|رمز|تأكيد|التحقق|التفعيل)[^\d]{0,25}(\d{4,8})\b/i);
  if(m) return m[1];
  m = s.match(/(?::|is|هو)\s*(\d{4,8})\b/i);
  if(m) return m[1];
  return null;
}

function fmtDate(d){
  try{
    const dt = new Date(d);
    if(isNaN(dt.getTime())) return String(d || '').slice(0, 20);
    const diff = (Date.now() - dt.getTime()) / 1000;
    if(diff < 60) return 'الآن';
    if(diff < 3600) return Math.floor(diff/60) + ' د';
    if(diff < 86400) return Math.floor(diff/3600) + ' س';
    return dt.toLocaleDateString('ar-EG',{day:'numeric',month:'short'});
  }catch(e){return ''}
}

/* ═══════ Fetch آمن — بدون بروكسي ═══════ */
async function gf(params, timeoutMs = FETCH_TIMEOUT){
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), timeoutMs);
  const t0 = performance.now();

  try{
    const res = await fetch(API + '?' + params, {
      signal: ctrl.signal,
      credentials: 'omit',
      cache: 'no-store',
      referrerPolicy: 'no-referrer'
    });
    clearTimeout(to);
    st.lastPing = Math.round(performance.now() - t0);
    updatePing();

    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    if(text.length > 2_000_000) throw new Error('Response too large');
    try { return JSON.parse(text); }
    catch(e){
      const cleaned = text.replace(/^[^{]*/, '').replace(/[^}]*$/, '');
      return JSON.parse(cleaned);
    }
  }catch(e){
    clearTimeout(to);
    throw e;
  }
}

function updatePing(){
  const el = $('pingBox');
  if(!el || !st.lastPing) return;
  const p = st.lastPing;
  const color = p < 300 ? 'var(--green-b)' : p < 800 ? 'var(--cyan)' : 'var(--orange,#fb923c)';
  el.style.color = color;
  el.textContent = '⚡ ' + p + 'ms';
}

/* ═══════ إنشاء حساب ═══════ */
async function createAccount(){
  $('emailDisplay').value = 'جاري التحضير...';
  stopPolling();
  try{
    const data = await gf('f=get_email_address', 8000);
    if(!data || !data.email_addr || !data.sid_token) throw new Error('Bad response');

    st.email = data.email_addr;
    st.sid = data.sid_token;
    st.seen.clear();
    st.msgs = [];
    st.bodyCache.clear();
    st.errors = 0;
    st.lastNew = Date.now();

    saveState();
    $('emailDisplay').value = st.email;
    renderAll();
    startPolling();
    checkMail();
    toast('✓ تم إنشاء البريد بنجاح');
  }catch(e){
    console.warn('createAccount:', e.message);
    $('emailDisplay').value = 'فشل — اضغط جديد';
    toast('فشل الاتصال — حاول تاني', true);
  }
}

/* ═══════ حفظ/استرجاع ═══════ */
function saveState(){
  try{
    localStorage.setItem('fm_v2', JSON.stringify({
      email: st.email,
      sid: st.sid,
      msgs: st.msgs.slice(0, 30).map(m => ({
        id: m.id,
        from: String(m.from || '').slice(0, 200),
        subject: String(m.subject || '').slice(0, 300),
        intro: String(m.intro || '').slice(0, 2000),
        body: String(m.body || '').slice(0, 8000),
        loaded: !!m.loaded,
        date: String(m.date || '').slice(0, 50)
      })),
      ts: Date.now()
    }));
  }catch(e){ console.warn('saveState:', e.message); }
}

function loadState(){
  try{
    const raw = localStorage.getItem('fm_v2');
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !d.email || !d.sid) return false;
    if(d.ts && Date.now() - d.ts > 86400000){
      localStorage.removeItem('fm_v2');
      return false;
    }
    st.email = d.email;
    st.sid = d.sid;
    if(Array.isArray(d.msgs)){
      st.msgs = d.msgs.filter(m => m && m.id).slice(0, 30);
      st.msgs.forEach(m => st.seen.add(String(m.id)));
    }
    return true;
  }catch(e){ return false; }
}

/* ═══════ Polling ذكي ═══════ */
function startPolling(){ stopPolling(); scheduleNext(); }
function scheduleNext(){
  if(st.timer) clearTimeout(st.timer);
  const sinceLast = Date.now() - st.lastNew;
  let delay = POLL_SLOW;
  if(sinceLast < FAST_WINDOW) delay = POLL_FAST;
  else if(sinceLast < 60000) delay = POLL_NORMAL;
  st.timer = setTimeout(async () => {
    await checkMail();
    scheduleNext();
  }, delay);
}
function stopPolling(){
  if(st.timer){ clearTimeout(st.timer); st.timer = null; }
}

/* ═══════ فحص الرسائل ═══════ */
async function checkMail(){
  if(!st.sid || st.polling) return;
  st.polling = true;

  try{
    const data = await gf('f=check_email&seq=0&sid_token=' + encodeURIComponent(st.sid));
    const list = Array.isArray(data && data.list) ? data.list : [];
    let hasNew = false;

    for(const m of list){
      if(!m || !m.mail_id) continue;
      const id = String(m.mail_id);
      if(st.seen.has(id)) continue;
      const from = String(m.mail_from || '');
      if(from.includes('no-reply@guerrillamail.com')) continue;
      if(from.length > 320) continue;

      st.seen.add(id);
      hasNew = true;
      st.msgs.push({
        id,
        from: from.slice(0, 200),
        subject: String(m.mail_subject || '(بدون عنوان)').slice(0, 300),
        intro: sanitize(m.mail_excerpt || '').slice(0, 2000),
        body: '',
        loaded: false,
        date: m.mail_date || ''
      });
    }

    if(hasNew){
      st.lastNew = Date.now();
      if(st.msgs.length > 30) st.msgs = st.msgs.slice(-30);
      saveState();
      renderAll(true);
      toast('📬 وصلتك رسالة جديدة!');
      const toFetch = st.msgs.filter(m => !m.loaded).slice(0, 5);
      Promise.all(toFetch.map(fetchBody)).catch(()=>{});
    }
    st.errors = 0;
  }catch(e){
    st.errors++;
    console.warn('checkMail:', e.message);
    if(st.errors >= 8){
      stopPolling();
      localStorage.removeItem('fm_v2');
      setTimeout(createAccount, 800);
    }
  }finally{
    st.polling = false;
  }
}

/* ═══════ جلب المحتوى ═══════ */
async function fetchBody(m){
  if(m.loaded) return;
  if(st.bodyCache.has(m.id)){
    m.body = st.bodyCache.get(m.id);
    m.loaded = true;
    updateBody(m);
    return;
  }
  try{
    const d = await gf('f=fetch_email&email_id=' + encodeURIComponent(m.id) + '&sid_token=' + encodeURIComponent(st.sid));
    if(!d) return;
    let text = '';
    if(typeof d.mail_body === 'string') text = d.mail_body;
    else if(Array.isArray(d.mail_body)) text = d.mail_body.join('\n');
    m.body = sanitize(text).slice(0, 8000);
    m.loaded = true;
    st.bodyCache.set(m.id, m.body);
    saveState();
    updateBody(m);
  }catch(e){
    console.warn('fetchBody:', e.message);
    m.loaded = true;
    m.body = m.intro || '(تعذر جلب المحتوى)';
    updateBody(m);
  }
}

function updateBody(m){
  const card = document.querySelector('[data-id="' + CSS.escape(m.id) + '"] .mail-body');
  if(!card) return;
  card.textContent = m.body || '(محتوى فارغ)';
  card.style.opacity = '0';
  requestAnimationFrame(() => {
    card.style.transition = 'opacity .3s';
    card.style.opacity = '1';
  });
  const code = findCode(m.subject + ' ' + m.body);
  const otpBox = document.querySelector('[data-id="' + CSS.escape(m.id) + '"] .otp');
  if(code && !otpBox) renderAll();
}

/* ═══════ Render آمن بالكامل (textContent) ═══════ */
function renderAll(animate){
  const list = $('messagesList');
  const cnt = $('countBox');
  cnt.textContent = st.msgs.length + ' رسالة';

  if(!st.msgs.length){
    list.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'empty';
    const icon = document.createElement('span');
    icon.className = 'empty-icon';
    icon.textContent = '📬';
    const t1 = document.createElement('div');
    t1.textContent = 'صندوق الوارد فارغ';
    const t2 = document.createElement('div');
    t2.style.cssText = 'font-size:11px;margin-top:6px;opacity:.7';
    t2.textContent = 'الرسائل ستظهر هنا تلقائياً دون إعادة تحميل';
    empty.appendChild(icon);
    empty.appendChild(t1);
    empty.appendChild(t2);
    list.appendChild(empty);
    return;
  }

  const sorted = [...st.msgs].reverse();
  const frag = document.createDocumentFragment();

  sorted.forEach((m, i) => {
    const code = findCode(m.subject + ' ' + (m.body || m.intro || ''));
    const card = document.createElement('div');
    card.className = 'mail';
    card.dataset.id = m.id;
    card.style.animationDelay = (i * 0.04) + 's';
    if(animate && i === 0) card.classList.add('new-flash');

    const head = document.createElement('div');
    head.className = 'mail-head';
    const fromEl = document.createElement('span');
    fromEl.className = 'mail-from';
    fromEl.textContent = m.from || '(مجهول)';
    fromEl.title = m.from;
    const dateEl = document.createElement('span');
    dateEl.className = 'mail-date';
    dateEl.textContent = fmtDate(m.date);
    head.appendChild(fromEl);
    head.appendChild(dateEl);
    card.appendChild(head);

    const subj = document.createElement('div');
    subj.className = 'mail-subject';
    subj.textContent = m.subject || '(بدون عنوان)';
    card.appendChild(subj);

    if(code){
      const otp = document.createElement('div');
      otp.className = 'otp';
      const inner = document.createElement('div');
      const lbl = document.createElement('div');
      lbl.className = 'otp-lbl';
      lbl.textContent = 'كود التحقق';
      const codeEl = document.createElement('div');
      codeEl.className = 'otp-code';
      codeEl.textContent = code;
      inner.appendChild(lbl);
      inner.appendChild(codeEl);
      const btn = document.createElement('button');
      btn.className = 'btn-otp';
      btn.textContent = '⚡ نسخ';
      btn.dataset.code = code;
      btn.addEventListener('click', () => copyText(code, btn));
      otp.appendChild(inner);
      otp.appendChild(btn);
      card.appendChild(otp);
    }

    const body = document.createElement('div');
    body.className = 'mail-body';
    if(m.loaded){
      body.textContent = m.body || '(محتوى فارغ)';
    }else{
      body.innerHTML = '<div class="skel" style="height:14px;width:90%"></div><div class="skel" style="height:14px;width:70%;margin-top:8px"></div><div class="skel" style="height:14px;width:80%;margin-top:8px"></div>';
    }
    card.appendChild(body);

    frag.appendChild(card);
  });

  list.innerHTML = '';
  list.appendChild(frag);
}

/* ═══════ نسخ آمن ═══════ */
async function copyText(text, btn){
  const safe = String(text).slice(0, 500);
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(safe);
    }else{
      const ta = document.createElement('textarea');
      ta.value = safe;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    if(btn){
      const old = btn.textContent;
      btn.textContent = '✓ تم';
      setTimeout(() => { btn.textContent = old; }, 1200);
    }
    toast('✓ تم النسخ');
  }catch(e){
    toast('تعذر النسخ', true);
  }
}

/* ═══════ Init ═══════ */
function init(){
  $('copyBtn').addEventListener('click', e => {
    if(st.email) copyText(st.email, e.currentTarget);
  });
  $('newBtn').addEventListener('click', () => {
    stopPolling();
    localStorage.removeItem('fm_v2');
    st = { email:'', sid:'', msgs:[], seen:new Set(), timer:null, polling:false, lastNew:Date.now(), errors:0, lastPing:0, bodyCache:new Map() };
    createAccount();
  });
  $('refreshBtn').addEventListener('click', async () => {
    const btn = $('refreshBtn');
    btn.disabled = true;
    await checkMail();
    btn.disabled = false;
  });
  window.addEventListener('beforeunload', stopPolling);
  window.addEventListener('pagehide', stopPolling);
  document.addEventListener('visibilitychange', () => {
    if(document.hidden) stopPolling();
    else if(st.sid){ st.lastNew = Date.now(); startPolling(); checkMail(); }
  });

  if(loadState()){
    $('emailDisplay').value = st.email;
    renderAll();
    startPolling();
    checkMail();
  }else{
    createAccount();
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{ init(); }

})();
</script>
</body>
</html>
