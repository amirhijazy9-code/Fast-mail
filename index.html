<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>⚡ بريدي السريع</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://api.mail.tm">
<link rel="dns-prefetch" href="https://api.mail.tm">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e17;--surface:#111827;--surface2:#1a2332;
  --border:#1f2937;--border-b:#2d3748;
  --text:#e6edf3;--dim:#8b949e;--mute:#6e7681;
  --blue:#58a6ff;--cyan:#22d3ee;--green:#10b981;
  --green-b:#34d399;--purple:#a371f7;--pink:#f472b6;
  --orange:#fb923c;--red:#f87171;
}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
  position:relative;
}

/* خلفية نيون متحركة */
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(circle at 10% 10%,rgba(88,166,255,.15),transparent 35%),
    radial-gradient(circle at 90% 90%,rgba(163,113,247,.15),transparent 35%),
    radial-gradient(circle at 50% 50%,rgba(16,185,129,.08),transparent 50%);
  pointer-events:none;z-index:0;
  animation:bgFloat 15s ease-in-out infinite alternate;
}
@keyframes bgFloat{
  0%{transform:scale(1) translate(0,0)}
  100%{transform:scale(1.1) translate(-30px,-20px)}
}

.app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:24px 14px 80px}

/* Header */
.hdr{text-align:center;margin-bottom:24px;animation:fadeDown .5s}
@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}

.pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 16px;
  background:linear-gradient(135deg,rgba(88,166,255,.15),rgba(34,211,238,.15));
  border:1px solid rgba(88,166,255,.4);
  border-radius:100px;font-size:11px;font-weight:800;
  color:var(--cyan);letter-spacing:1px;margin-bottom:12px;
  text-transform:uppercase;font-family:monospace;
}

.live-dot{
  width:7px;height:7px;background:var(--green-b);
  border-radius:50%;animation:pulse 1.5s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(52,211,153,.7)}
  70%{box-shadow:0 0 0 12px rgba(52,211,153,0)}
  100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}
}

h1{
  font-size:clamp(28px,7vw,44px);font-weight:900;
  background:linear-gradient(135deg,#58a6ff,#22d3ee,#a371f7,#f472b6);
  background-size:300% 300%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:-1.5px;line-height:1.1;margin-bottom:6px;
  animation:gradient 4s ease infinite;
}
@keyframes gradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.sub{color:var(--dim);font-size:13px;font-weight:500}

/* Cards */
.card{
  background:linear-gradient(180deg,rgba(17,24,39,.95),rgba(10,14,23,.9));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:18px;
  padding:20px;margin-bottom:16px;
  box-shadow:0 20px 60px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);
  position:relative;overflow:hidden;
  animation:fadeUp .5s backwards;
}
.card:nth-child(2){animation-delay:.1s}
.card:nth-child(3){animation-delay:.2s}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(88,166,255,.6),transparent);
}

.lbl{
  display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:800;color:var(--dim);
  text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;
  font-family:monospace;
}
.lbl-dot{width:5px;height:5px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue)}

/* Email bar */
.email-bar{display:flex;gap:10px;flex-wrap:wrap}
.email-input{
  flex:1;min-width:220px;
  background:rgba(10,14,23,.9);
  border:1.5px solid var(--border);
  color:var(--cyan);padding:14px 16px;border-radius:12px;
  font-family:'JetBrains Mono',Consolas,monospace;
  font-size:14px;font-weight:700;
  direction:ltr;text-align:left;outline:none;
  transition:all .2s;letter-spacing:.3px;
}
.email-input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(88,166,255,.15)}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 18px;border:none;border-radius:12px;
  font-family:inherit;font-size:13px;font-weight:800;
  cursor:pointer;transition:all .15s;
  white-space:nowrap;position:relative;overflow:hidden;
}
.btn:active{transform:scale(.95)}

.btn-primary{
  background:linear-gradient(135deg,#059669,#10b981);
  color:#fff;box-shadow:0 6px 20px rgba(16,185,129,.4);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(16,185,129,.55)}

.btn-ghost{
  background:rgba(31,41,55,.7);color:var(--text);
  border:1px solid var(--border-b);
}
.btn-ghost:hover{background:var(--surface2);border-color:var(--blue);transform:translateY(-2px)}

/* Inbox header */
.inbox-hdr{
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:14px;border-bottom:1px solid var(--border);
  margin-bottom:14px;flex-wrap:wrap;gap:10px;
}

.status{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;font-weight:800;color:var(--green-b);
  font-family:monospace;
}

.ping{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;background:rgba(34,211,238,.1);
  border:1px solid rgba(34,211,238,.3);
  border-radius:100px;font-size:10px;font-weight:800;
  color:var(--cyan);font-family:monospace;
}

.count{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;background:rgba(88,166,255,.1);
  border:1px solid rgba(88,166,255,.3);
  border-radius:100px;font-size:12px;font-weight:800;
  color:var(--blue);font-family:monospace;
}

.btn-refresh{
  display:inline-flex;align-items:center;gap:5px;
  padding:7px 12px;background:transparent;
  border:1px solid var(--border-b);border-radius:10px;
  color:var(--blue);font-size:11px;font-weight:800;
  cursor:pointer;transition:all .2s;font-family:inherit;
}
.btn-refresh:hover{background:rgba(88,166,255,.08);border-color:var(--blue)}
.btn-refresh.spinning svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Messages */
.messages{display:flex;flex-direction:column;gap:12px;min-height:60px}

.empty{
  text-align:center;padding:50px 20px;color:var(--mute);
  font-size:13px;animation:fadeIn .4s;
}
.empty-icon{font-size:52px;opacity:.3;margin-bottom:12px;display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Mail card */
.mail{
  background:linear-gradient(180deg,rgba(10,14,23,.7),rgba(17,24,39,.6));
  border:1px solid var(--border);border-radius:14px;
  padding:16px;transition:all .25s;
  position:relative;overflow:hidden;
  animation:slideIn .35s cubic-bezier(.2,.9,.3,1.1) backwards;
}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px) scale(.98)}to{opacity:1;transform:translateX(0) scale(1)}}

.mail::before{
  content:'';position:absolute;top:0;right:0;width:3px;height:100%;
  background:linear-gradient(180deg,var(--cyan),var(--purple));
  opacity:0;transition:opacity .3s;
}
.mail:hover{border-color:var(--border-b);transform:translateY(-2px);box-shadow:0 12px 40px -8px rgba(88,166,255,.25)}
.mail:hover::before{opacity:1}

.mail.new-flash{
  animation:newFlash 1.5s ease-out;
}
@keyframes newFlash{
  0%{background:linear-gradient(180deg,rgba(16,185,129,.2),rgba(10,14,23,.7));box-shadow:0 0 0 3px rgba(16,185,129,.5)}
  100%{background:linear-gradient(180deg,rgba(10,14,23,.7),rgba(17,24,39,.6));box-shadow:0 0 0 0 rgba(16,185,129,0)}
}

.mail-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:11px}

.mail-from{
  color:var(--cyan);font-weight:800;direction:ltr;
  font-family:monospace;font-size:10px;
  padding:4px 9px;background:rgba(34,211,238,.1);
  border-radius:6px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:65%;
}

.mail-date{color:var(--mute);font-size:10px;font-weight:700;font-family:monospace}

.mail-subject{
  font-size:15px;font-weight:800;color:var(--text);
  margin-bottom:12px;line-height:1.4;word-break:break-word;
}

/* OTP Box */
.otp{
  background:linear-gradient(135deg,rgba(16,185,129,.18),rgba(52,211,153,.08));
  border:1.5px solid rgba(16,185,129,.5);
  border-radius:12px;padding:14px 16px;
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin-bottom:12px;position:relative;overflow:hidden;
  animation:otpGlow 2.5s ease-in-out infinite;
}
@keyframes otpGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}
  50%{box-shadow:0 0 25px 0 rgba(16,185,129,.35)}
}
.otp::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
  animation:shimmer 2.5s infinite;
}
@keyframes shimmer{100%{left:100%}}

.otp-lbl{font-size:9px;font-weight:900;color:var(--green-b);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-family:monospace}
.otp-code{
  font-family:'JetBrains Mono',Consolas,monospace;
  font-size:26px;font-weight:900;letter-spacing:5px;
  color:var(--green-b);direction:ltr;
  text-shadow:0 0 25px rgba(52,211,153,.6);
}

.btn-otp{
  background:linear-gradient(135deg,#059669,#10b981);
  color:#fff;border:none;padding:11px 16px;border-radius:10px;
  font-family:inherit;font-size:12px;font-weight:900;
  cursor:pointer;transition:all .15s;
  box-shadow:0 6px 20px rgba(16,185,129,.4);
  white-space:nowrap;
}
.btn-otp:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(16,185,129,.6)}
.btn-otp:active{transform:scale(.94)}

/* Mail body */
.mail-body{
  background:rgba(10,14,23,.85);
  border:1px solid var(--border);border-radius:10px;
  padding:13px 15px;font-size:12.5px;line-height:1.7;
  color:#b8c2cc;direction:ltr;text-align:left;
  white-space:pre-wrap;word-break:break-word;
  max-height:180px;overflow-y:auto;
  font-family:'JetBrains Mono',Consolas,monospace;
}
.mail-body::-webkit-scrollbar{width:6px}
.mail-body::-webkit-scrollbar-track{background:transparent}
.mail-body::-webkit-scrollbar-thumb{background:var(--border-b);border-radius:3px}

/* Skeleton */
.skel{
  background:linear-gradient(90deg,rgba(31,41,55,.4) 25%,rgba(45,55,72,.6) 50%,rgba(31,41,55,.4) 75%);
  background-size:200% 100%;
  animation:skel 1.4s infinite;
  border-radius:6px;
}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Toast */
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:90vw}
.toast{
  background:linear-gradient(135deg,rgba(16,185,129,.95),rgba(5,150,105,.95));
  color:#fff;padding:12px 20px;border-radius:12px;
  font-size:13px;font-weight:800;
  box-shadow:0 15px 40px rgba(0,0,0,.5),0 0 30px rgba(16,185,129,.5);
  animation:toastIn .35s cubic-bezier(.2,.9,.3,1.2);
  backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);
  text-align:center;
}
.toast.err{background:linear-gradient(135deg,rgba(248,113,113,.95),rgba(220,38,38,.95))}
@keyframes toastIn{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Responsive */
@media(max-width:520px){
  .app{padding:16px 10px 60px}
  .card{padding:16px;border-radius:16px}
  .email-bar{flex-direction:column}
  .email-input{min-width:100%}
  .btn{width:100%}
  .otp{flex-direction:column;align-items:flex-start;gap:10px}
  .otp-code{font-size:22px;letter-spacing:3px}
  .otp .btn-otp{width:100%}
}
</style>
</head>
<body>

<div class="app">
  <header class="hdr">
    <div class="pill"><span class="live-dot"></span>LIVE • متصل</div>
    <h1>بريدي السريع</h1>
    <p class="sub">⚡ استقبال فوري — أقل من ثانية</p>
  </header>

  <div class="card">
    <div class="lbl"><span class="lbl-dot"></span>بريدك الحالي</div>
    <div class="email-bar">
      <input type="text" id="emailDisplay" class="email-input" value="جاري التحضير..." readonly>
      <button class="btn btn-primary" id="copyBtn">📋 نسخ</button>
      <button class="btn btn-ghost" id="newBtn">🔄 جديد</button>
    </div>
  </div>

  <div class="card">
    <div class="inbox-hdr">
      <div class="status"><span class="live-dot"></span>جاهز للاستقبال</div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="ping" id="pingBox">⚡ --ms</span>
        <span class="count" id="countBox">0 رسالة</span>
        <button class="btn-refresh" id="refreshBtn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.8 1 6.5 2.6"/>
            <polyline points="21 3 21 9 15 9"/>
          </svg>
          تحديث
        </button>
      </div>
    </div>
    <div class="messages" id="messagesList">
      <div class="empty">
        <span class="empty-icon">📬</span>
        <div>صندوق الوارد فارغ</div>
        <div style="font-size:11px;margin-top:6px;opacity:.7">الرسائل ستظهر هنا فوراً</div>
      </div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
(function(){
'use strict';

/* ═══════════ API mail.tm (أسرع 5 مرات من guerrilla) ═══════════ */
const API = 'https://api.mail.tm';
const POLL_FAST = 800;    // أول 20 ثانية
const POLL_NORMAL = 1800;  // بعدها
const POLL_SLOW = 3500;    // بعد دقيقة من الهدوء
const FAST_WINDOW = 20000;

let st = {
  email: '', pass: '', token: '', id: '',
  msgs: [],
  seen: new Set(),
  timer: null,
  polling: false,
  lastNew: Date.now(),
  errors: 0,
  lastPing: 0
};

const $ = id => document.getElementById(id);

/* ═══════════ Utils ═══════════ */
function toast(msg, err){
  const c = $('toasts');
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'all .3s';
    t.style.opacity = '0';
    t.style.transform = 'translateY(30px)';
    setTimeout(() => t.remove(), 300);
  }, 2000);
}

function sanitize(s){
  if(typeof s !== 'string') return '';
  return s
    .replace(/<style[\s\S]*?<\/style>/gi,'')
    .replace(/<script[\s\S]*?<\/script>/gi,'')
    .replace(/<[^>]*>/g,' ')
    .replace(/&nbsp;/gi,' ')
    .replace(/&amp;/gi,'&')
    .replace(/&lt;/gi,'<')
    .replace(/&gt;/gi,'>')
    .replace(/&quot;/gi,'"')
    .replace(/&#39;/gi,"'")
    .replace(/\s+/g,' ')
    .trim();
}

function findCode(txt){
  if(!txt) return null;
  const s = txt.slice(0,5000);
  let m = s.match(/(?:code|otp|verify|verification|pin|كود|رمز|تأكيد|التحقق|التفعيل)[^\d]{0,25}(\d{4,8})\b/i);
  if(m) return m[1];
  m = s.match(/(?::|is|هو)\s*(\d{4,8})\b/i);
  if(m) return m[1];
  return null;
}

function fmtDate(d){
  try{
    const dt = new Date(d);
    const diff = (Date.now() - dt.getTime()) / 1000;
    if(diff < 60) return 'الآن';
    if(diff < 3600) return Math.floor(diff/60) + ' د';
    if(diff < 86400) return Math.floor(diff/3600) + ' س';
    return dt.toLocaleDateString('ar-EG',{day:'numeric',month:'short'});
  }catch(e){return ''}
}

/* ═══════════ Fetch سريع مع Timeout ═══════════ */
async function api(path, opts = {}){
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 6000);
  const t0 = performance.now();

  try{
    const res = await fetch(API + path, {
      ...opts,
      signal: ctrl.signal,
      headers: {
        'Content-Type': 'application/json',
        ...(st.token ? { 'Authorization': 'Bearer ' + st.token } : {}),
        ...(opts.headers || {})
      }
    });
    clearTimeout(to);
    st.lastPing = Math.round(performance.now() - t0);
    updatePing();

    if(!res.ok){
      const err = new Error('HTTP ' + res.status);
      err.status = res.status;
      throw err;
    }

    const ct = res.headers.get('content-type') || '';
    if(ct.includes('application/json')){
      return await res.json();
    }
    return null;
  }catch(e){
    clearTimeout(to);
    throw e;
  }
}

function updatePing(){
  const el = $('pingBox');
  if(!el || !st.lastPing) return;
  const p = st.lastPing;
  const color = p < 300 ? 'var(--green-b)' : p < 800 ? 'var(--cyan)' : 'var(--orange)';
  el.style.color = color;
  el.textContent = '⚡ ' + p + 'ms';
}

/* ═══════════ إنشاء حساب سريع ═══════════ */
async function createAccount(){
  $('emailDisplay').value = 'جاري التحضير...';

  try{
    // 1. جيب الدومينات
    const domains = await api('/domains?page=1');
    if(!Array.isArray(domains) || !domains.length) throw new Error('No domains');

    const domain = domains[0].domain;

    // 2. اعمل بيانات الحساب
    const rand = Math.random().toString(36).slice(2,10);
    const email = rand + '@' + domain;
    const pass = Math.random().toString(36).slice(2,14) + 'Aa1!';

    // 3. سجل الحساب
    await api('/accounts', {
      method: 'POST',
      body: JSON.stringify({ address: email, password: pass })
    });

    // 4. سجل دخول
    const login = await api('/token', {
      method: 'POST',
      body: JSON.stringify({ address: email, password: pass })
    });

    if(!login || !login.token) throw new Error('Login failed');

    st.email = email;
    st.pass = pass;
    st.token = login.token;
    st.id = login.id;
    st.seen.clear();
    st.msgs = [];

    saveState();
    $('emailDisplay').value = email;
    renderAll();
    startPolling();
    checkMail();

  }catch(e){
    console.warn('createAccount:', e.message);
    $('emailDisplay').value = 'فشل — اضغط جديد';
    toast('فشل الاتصال — حاول تاني', true);
  }
}

/* ═══════════ استرجاع الحساب المحفوظ ═══════════ */
function saveState(){
  try{
    localStorage.setItem('fm', JSON.stringify({
      email: st.email, pass: st.pass, token: st.token, id: st.id, ts: Date.now()
    }));
  }catch(e){}
}

function loadState(){
  try{
    const raw = localStorage.getItem('fm');
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !d.email || !d.token) return false;
    if(d.ts && Date.now() - d.ts > 86400000) return false;

    st.email = d.email;
    st.pass = d.pass;
    st.token = d.token;
    st.id = d.id;
    return true;
  }catch(e){return false}
}

/* ═══════════ Polling ذكي ═══════════ */
function startPolling(){
  stopPolling();
  scheduleNext();
}

function scheduleNext(){
  if(st.timer) clearTimeout(st.timer);
  const sinceLast = Date.now() - st.lastNew;

  let delay = POLL_SLOW;
  if(sinceLast < FAST_WINDOW) delay = POLL_FAST;
  else if(sinceLast < 60000) delay = POLL_NORMAL;

  st.timer = setTimeout(async () => {
    await checkMail();
    scheduleNext();
  }, delay);
}

function stopPolling(){
  if(st.timer){ clearTimeout(st.timer); st.timer = null; }
}

/* ═══════════ فحص الرسائل (سريع) ═══════════ */
async function checkMail(){
  if(!st.token || st.polling) return;
  st.polling = true;

  try{
    const data = await api('/messages?page=1');
    const list = Array.isArray(data?.['hydra:member']) ? data['hydra:member']
               : Array.isArray(data) ? data : [];

    let hasNew = false;

    for(const m of list){
      if(!m || !m.id || st.seen.has(m.id)) continue;

      st.seen.add(m.id);
      hasNew = true;

      // نضيف placeholder فوراً
      const idx = st.msgs.push({
        id: m.id,
        from: (m.from?.address || '').slice(0,200),
        fromName: (m.from?.name || '').slice(0,100),
        subject: (m.subject || '(بدون عنوان)').slice(0,300),
        intro: sanitize(m.intro || '').slice(0,5000),
        body: '',
        loaded: false,
        date: m.createdAt || new Date().toISOString()
      }) - 1;

      // نعرض فوراً
      renderAll(true);

      // نجيب المحتوى الكامل في الخلفية
      fetchBody(m.id, idx);
    }

    if(hasNew){
      st.lastNew = Date.now();
      toast('📬 وصلتك رسالة جديدة!');
    }

    st.errors = 0;
  }catch(e){
    st.errors++;
    console.warn('checkMail:', e.message);

    // لو الجلسة انتهت
    if(e.status === 401 || e.status === 403 || st.errors >= 6){
      stopPolling();
      localStorage.removeItem('fm');
      setTimeout(createAccount, 800);
    }
  }finally{
    st.polling = false;
  }
}

/* ═══════════ جلب محتوى الرسالة ═══════════ */
async function fetchBody(id, idx){
  try{
    const d = await api('/messages/' + id);
    if(!d) return;
    const m = st.msgs[idx];
    if(!m) return;

    m.body = sanitize(d.text || d.html?.[0] || d.intro || '').slice(0, 8000);
    m.loaded = true;

    const card = document.querySelector('[data-id="' + id + '"] .mail-body');
    if(card){
      card.textContent = m.body || '(محتوى فارغ)';
      card.style.opacity = '0';
      requestAnimationFrame(() => {
        card.style.transition = 'opacity .3s';
        card.style.opacity = '1';
      });
    }
  }catch(e){
    console.warn('fetchBody:', e.message);
  }
}

/* ═══════════ Render ═══════════ */
function renderAll(animate){
  const list = $('messagesList');
  const cnt = $('countBox');

  cnt.textContent = st.msgs.length + ' رسالة';

  if(!st.msgs.length){
    list.innerHTML = '<div class="empty"><span class="empty-icon">📬</span><div>صندوق الوارد فارغ</div><div style="font-size:11px;margin-top:6px;opacity:.7">الرسائل ستظهر هنا فوراً</div></div>';
    return;
  }

  // ترتيب الأحدث أولاً
  const sorted = [...st.msgs].reverse();

  // نبني DOM جديد مرة واحدة (أسرع)
  const frag = document.createDocumentFragment();

  sorted.forEach((m, i) => {
    const code = findCode(m.subject + ' ' + (m.body || m.intro || ''));

    const card = document.createElement('div');
    card.className = 'mail';
    card.dataset.id = m.id;
    card.style.animationDelay = (i * 0.04) + 's';

    // Head
    const head = document.createElement('div');
    head.className = 'mail-head';

    const fromEl = document.createElement('span');
    fromEl.className = 'mail-from';
    fromEl.textContent = m.from || '(مجهول)';
    fromEl.title = m.from;

    const dateEl = document.createElement('span');
    dateEl.className = 'mail-date';
    dateEl.textContent = fmtDate(m.date);

    head.appendChild(fromEl);
    head.appendChild(dateEl);
    card.appendChild(head);

    // Subject
    const subj = document.createElement('div');
    subj.className = 'mail-subject';
    subj.textContent = m.subject || '(بدون عنوان)';
    card.appendChild(subj);

    // OTP
    if(code){
      const otp = document.createElement('div');
      otp.className = 'otp';

      const inner = document.createElement('div');
      const lbl = document.createElement('div');
      lbl.className = 'otp-lbl';
      lbl.textContent = 'كود التحقق';
      const codeEl = document.createElement('div');
      codeEl.className = 'otp-code';
      codeEl.textContent = code;
      inner.appendChild(lbl);
      inner.appendChild(codeEl);

      const btn = document.createElement('button');
      btn.className = 'btn-otp';
      btn.textContent = '⚡ نسخ';
      btn.addEventListener('click', () => copyText(code, btn, 'كود'));

      otp.appendChild(inner);
      otp.appendChild(btn);
      card.appendChild(otp);
    }

    // Body
    const body = document.createElement('div');
    body.className = 'mail-body';
    if(m.loaded){
      body.textContent = m.body || '(محتوى فارغ)';
    }else{
      body.innerHTML = '<div class="skel" style="height:14px;width:90%"></div><div class="skel" style="height:14px;width:70%;margin-top:8px"></div><div class="skel" style="height:14px;width:80%;margin-top:8px"></div>';
    }
    card.appendChild(body);

    // Flash لو جديدة
    if(animate && i === 0){
      card.classList.add('new-flash');
    }

    frag.appendChild(card);
  });

  list.innerHTML = '';
  list.appendChild(frag);
}

/* ═══════════ Copy ═══════════ */
async function copyText(text, btn, label){
  const safe = String(text).slice(0, 500);
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(safe);
    }else{
      const ta = document.createElement('textarea');
      ta.value = safe;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    if(btn){
      const old = btn.textContent;
      btn.textContent = '✓ تم';
      setTimeout(() => { btn.textContent = old; }, 1200);
    }
    toast('✓ تم نسخ ' + label);
  }catch(e){
    toast('تعذر النسخ', true);
  }
}

/* ═══════════ Init ═══════════ */
function init(){
  // أحداث
  $('copyBtn').addEventListener('click', e => {
    if(st.email) copyText(st.email, e.currentTarget, 'البريد');
  });

  $('newBtn').addEventListener('click', () => {
    stopPolling();
    localStorage.removeItem('fm');
    st = { email:'', pass:'', token:'', id:'', msgs:[], seen:new Set(), timer:null, polling:false, lastNew:Date.now(), errors:0, lastPing:0 };
    createAccount();
  });

  $('refreshBtn').addEventListener('click', async e => {
    const btn = e.currentTarget;
    btn.classList.add('spinning');
    btn.disabled = true;
    await checkMail();
    btn.classList.remove('spinning');
    btn.disabled = false;
  });

  window.addEventListener('beforeunload', stopPolling);
  window.addEventListener('pagehide', stopPolling);

  document.addEventListener('visibilitychange', () => {
    if(document.hidden){
      stopPolling();
    }else if(st.token){
      st.lastNew = Date.now(); // نرجع للوضع السريع
      startPolling();
      checkMail();
    }
  });

  // تحميل الحالة أو إنشاء حساب
  if(loadState()){
    $('emailDisplay').value = st.email;
    renderAll();
    startPolling();
    checkMail();
    // تحقق من صلاحية الـ token
    api('/me').catch(() => {
      localStorage.removeItem('fm');
      createAccount();
    });
  }else{
    createAccount();
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{
  init();
}

})();
</script>
